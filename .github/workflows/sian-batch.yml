name: SIAN · análisis por lotes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de análisis
        run: python -m pip install scipy networkx matplotlib
      - name: Descargar corpus privado
        env:
          SIAN_CORPUS_URL: ${{ secrets.SIAN_CORPUS_URL }}
        run: |
          python - <<'PY'
          import os, shutil, urllib.request
          from urllib.parse import urlsplit
          url = os.environ.get("SIAN_CORPUS_URL", "")
          if urlsplit(url).scheme != "https":
              raise SystemExit("Configura SIAN_CORPUS_URL con una URL HTTPS privada de descarga.")
          try:
              with urllib.request.urlopen(url, timeout=120) as source, open("corpus.json", "wb") as dest:
                  shutil.copyfileobj(source, dest)
          except Exception:
              raise SystemExit("No se pudo descargar el corpus privado. Comprueba el acceso y la caducidad de la URL.") from None
          PY
      - name: Ejecutar agentes y cifrar resultados
        env:
          SIAN_RESULTS_PASSPHRASE: ${{ secrets.SIAN_RESULTS_PASSPHRASE }}
        run: |
          test -n "$SIAN_RESULTS_PASSPHRASE" || { echo 'Configura SIAN_RESULTS_PASSPHRASE.'; exit 1; }
          python batch_analysis.py corpus.json SIAN_resultados.zip
          printf '%s\n' "$SIAN_RESULTS_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output SIAN_resultados.zip.gpg SIAN_resultados.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SIAN-resultados-cifrados
          path: SIAN_resultados.zip.gpg
          if-no-files-found: error
          retention-days: 7
